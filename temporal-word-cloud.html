<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Word Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
        }
        #viz {
            background: #16213e;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: grab;
        }
        #viz:active {
            cursor: grabbing;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        button {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #16425b;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background: #0f3460;
        }
        .error {
            background: #d32f2f;
        }
        .loading {
            background: #f57c00;
        }
        .success {
            background: #388e3c;
        }
        input[type="range"] {
            cursor: pointer;
        }
        label {
            color: #eee;
            font-size: 14px;
            margin-left: 20px;
        }
        .axis {
            font-size: 12px;
        }
        .axis-label {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h2>Temporal Force-Directed Word Cloud</h2>
        <p>X-axis: Time period | Y-axis: Commonality (top = year-specific, bottom = appears across many years)</p>
        <button onclick="restartSimulation()" id="restartBtn" disabled>Restart Animation</button>
        <button onclick="resetZoom()" id="resetZoomBtn" disabled>Reset Zoom</button>
        <label>
            Force Strength: 
            <input type="range" id="forceStrength" min="0.1" max="1.0" step="0.1" value="0.6" onchange="updateForceStrength(this.value)" style="width: 150px; vertical-align: middle;">
            <span id="forceValue">0.3</span>
        </label>
        <div id="status" class="status success">Using sample temporal data (1960-2024)</div>
    </div>
    <svg id="viz"></svg>

    <script>
        // Sample temporal data structure
        // Each word has frequencies across different time periods
        // const sampleTemporalData = [
        //     // Technology terms - evolving over time
        //     { word: "computer", periods: {1960: 5, 1968: 8, 1976: 12, 1984: 18, 1992: 15, 2000: 10, 2008: 8, 2016: 5, 2024: 3} },
        //     { word: "internet", periods: {1992: 2, 2000: 25, 2008: 20, 2016: 15, 2024: 10} },
        //     { word: "smartphone", periods: {2008: 5, 2016: 30, 2024: 25} },
        //     { word: "AI", periods: {1960: 3, 1968: 2, 2016: 8, 2024: 35} },
        //     { word: "cloud", periods: {2008: 10, 2016: 20, 2024: 18} },
        //     { word: "data", periods: {1960: 8, 1976: 10, 1992: 12, 2008: 18, 2024: 22} },
            
        //     // Social/cultural terms
        //     { word: "social", periods: {1960: 10, 1976: 12, 1992: 15, 2008: 20, 2016: 18, 2024: 16} },
        //     { word: "media", periods: {1960: 8, 1976: 10, 2000: 15, 2016: 25, 2024: 20} },
        //     { word: "digital", periods: {1992: 5, 2000: 15, 2008: 20, 2016: 22, 2024: 18} },
        //     { word: "virtual", periods: {2000: 8, 2008: 10, 2016: 15, 2024: 25} },
            
        //     // Consistent terms across time
        //     { word: "communication", periods: {1960: 12, 1968: 13, 1976: 14, 1984: 15, 1992: 14, 2000: 13, 2008: 15, 2016: 14, 2024: 13} },
        //     { word: "information", periods: {1960: 10, 1968: 11, 1976: 12, 1984: 13, 1992: 14, 2000: 15, 2008: 14, 2016: 13, 2024: 12} },
        //     { word: "technology", periods: {1960: 8, 1968: 10, 1976: 12, 1984: 14, 1992: 16, 2000: 18, 2008: 17, 2016: 16, 2024: 15} },
            
        //     // Period-specific terms
        //     { word: "mainframe", periods: {1960: 15, 1968: 18, 1976: 12, 1984: 8} },
        //     { word: "telegram", periods: {1960: 20, 1968: 12} },
        //     { word: "podcast", periods: {2008: 12, 2016: 20, 2024: 18} },
        //     { word: "blockchain", periods: {2016: 15, 2024: 12} },
        //     { word: "metaverse", periods: {2024: 20} },
        //     { word: "streaming", periods: {2008: 8, 2016: 18, 2024: 22} },
        // ];

        function getDimensions() {
            const container = document.querySelector('.controls');
            const containerHeight = container ? container.offsetHeight : 150;
            return {
                width: Math.max(1600, window.innerWidth - 40),
                height: Math.max(900, window.innerHeight - containerHeight - 60)
            };
        }
        
        let width, height;
        const svg = d3.select("#viz");
        let nodes = [];
        let simulation;
        let tooltip;
        let zoom;
        let g;
        let timePoints = [];
        let xScale, yScale;

        // Calculate weighted centroid position for a word based on temporal distribution
        function calculateTemporalTarget(periods, useScales = false) {
            const periodYears = Object.keys(periods).map(Number);
            const frequencies = Object.values(periods);
            const totalFreq = frequencies.reduce((a, b) => a + b, 0);
            
            // Calculate weighted average year (x position)
            let weightedYear = 0;
            periodYears.forEach((year, i) => {
                weightedYear += year * frequencies[i];
            });
            weightedYear = weightedYear / totalFreq;
            
            // Calculate spread (how many periods the word appears in)
            const numPeriods = periodYears.length;
            const maxPeriods = timePoints.length;
            
            // Y position: words in few periods go high (specific), words in many periods go low (common)
            const specificity = 1 - (numPeriods / maxPeriods);
            
            return {
                x: useScales ? xScale(weightedYear) : weightedYear,
                y: useScales ? yScale(specificity) : specificity,
                specificity: specificity,
                weightedYear: weightedYear,
                numPeriods: numPeriods
            };
        }

        function getTemporalColor(specificity) {
            // Color gradient: specific (red) to common (blue)
            const color = d3.interpolateViridis(1 - specificity);
            return color;
        }

        function initSimulation() {
            const dims = getDimensions();
            width = dims.width;
            height = dims.height;
            
            const margin = { top: 40, right: 40, bottom: 60, left: 60 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;
            
            svg.attr("width", width).attr("height", height);
            svg.selectAll("*").remove();
            
            // Create scales
            const minYear = Math.min(...timePoints);
            const maxYear = Math.max(...timePoints);
            const yearRange = maxYear - minYear;
            
            xScale = d3.scaleLinear()
                .domain([minYear - yearRange * 0.05, maxYear + yearRange * 0.05])
                .range([margin.left + 80, width - margin.right - 80]);
            
            yScale = d3.scaleLinear()
                .domain([-0.1, 1.1])  // Extended domain for padding
                .range([height - margin.bottom - 80, margin.top + 80]);
            
            // Recalculate targets with new scales
            nodes.forEach(node => {
                const target = calculateTemporalTarget(node.periods, true);
                node.x = target.x + (Math.random() - 0.5) * 100;
                node.y = target.y + (Math.random() - 0.5) * 100;
                node.target = { x: target.x, y: target.y };
            });
            
            g = svg.append("g");
            
            // Set up zoom
            zoom = d3.zoom()
                .scaleExtent([0.5, 5])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                });
            
            svg.call(zoom);
            
            // Draw axes
            const axisGroup = g.append("g").attr("class", "axes");
            
            // X axis (timeline) - clip to visible range
            const xAxis = d3.axisBottom(xScale)
                .tickValues(timePoints)
                .tickFormat(d3.format("d"));
            
            axisGroup.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0, ${height - margin.bottom})`)
                .call(xAxis)
                .selectAll("text")
                .attr("fill", "#aaa");
            
            axisGroup.selectAll(".axis path, .axis line")
                .attr("stroke", "#555");
            
            // X axis label
            axisGroup.append("text")
                .attr("class", "axis-label")
                .attr("x", width / 2)
                .attr("y", height - 10)
                .attr("text-anchor", "middle")
                .attr("fill", "#eee")
                .text("Time Period");
            
            // Y axis (specificity) - only show labels at extremes
            const yAxis = d3.axisLeft(yScale)
                .tickValues([0, 1])
                .tickFormat(d => d === 1 ? "Specific" : d === 0 ? "Common" : "");
            
            axisGroup.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(${margin.left}, 0)`)
                .call(yAxis)
                .selectAll("text")
                .attr("fill", "#aaa");
            
            axisGroup.selectAll(".axis path, .axis line")
                .attr("stroke", "#555");
            
            // Y axis label
            axisGroup.append("text")
                .attr("class", "axis-label")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", 15)
                .attr("text-anchor", "middle")
                .attr("fill", "#eee")
                .text("Commonality");
            
            // Draw timeline markers only for actual data points
            const markerGroup = g.append("g").attr("class", "markers");
            
            timePoints.forEach(year => {
                const xPos = xScale(year);
                // Only draw if within visible range
                if (xPos >= margin.left && xPos <= width - margin.right) {
                    markerGroup.append("line")
                        .attr("x1", xPos)
                        .attr("x2", xPos)
                        .attr("y1", yScale(1))
                        .attr("y2", yScale(0))
                        .attr("stroke", "#333")
                        .attr("stroke-width", 1)
                        .attr("stroke-dasharray", "2,2");
                }
            });
            
            // Create force simulation
            const forceStrength = parseFloat(document.getElementById('forceStrength').value);
            
            simulation = d3.forceSimulation(nodes)
                .force("charge", d3.forceManyBody().strength(-80))
                .force("collision", d3.forceCollide()
                    .radius(d => d.radius + 3)
                    .strength(0.9))
                .force("x", d3.forceX(d => d.target.x).strength(forceStrength))
                .force("y", d3.forceY(d => d.target.y).strength(forceStrength))
                .force("bounds", () => {
                    // Constrain nodes to stay within the plot area
                    nodes.forEach(d => {
                        const padding = d.radius + 5;
                        const minX = margin.left + padding;
                        const maxX = width - margin.right - padding;
                        const minY = margin.top + padding;
                        const maxY = height - margin.bottom - padding;
                        
                        d.x = Math.max(minX, Math.min(maxX, d.x));
                        d.y = Math.max(minY, Math.min(maxY, d.y));
                    });
                })
                .alphaDecay(0.02);
            
            // Create word elements
            const node = g.append("g")
                .selectAll("g")
                .data(nodes)
                .join("g")
                .attr("cursor", "pointer");
            
            node.append("circle")
                .attr("r", d => d.radius)
                .attr("fill", d => d.color)
                .attr("opacity", 0.8)
                .attr("stroke", "#fff")
                .attr("stroke-width", 0.5);
            
            node.append("text")
                .text(d => d.word)
                .attr("text-anchor", "middle")
                .attr("dy", "0.3em")
                .attr("font-size", d => Math.max(10, d.radius * 0.7))
                .attr("fill", "#fff")
                .attr("pointer-events", "none")
                .style("text-shadow", "0 0 3px rgba(0,0,0,0.8)");
            
            // Create tooltip
            if (!tooltip) {
                tooltip = d3.select("body").append("div")
                    .style("position", "absolute")
                    .style("background", "rgba(0,0,0,0.9)")
                    .style("color", "#fff")
                    .style("padding", "10px")
                    .style("border-radius", "4px")
                    .style("font-size", "12px")
                    .style("pointer-events", "none")
                    .style("opacity", 0);
            }
            
            node.on("mouseover", function(event, d) {
                const periods = Object.entries(d.periods)
                    .sort((a, b) => a[0] - b[0])
                    .map(([year, freq]) => `${year}: ${freq}`)
                    .join("<br>");
                
                tooltip
                    .style("opacity", 1)
                    .html(`<strong>${d.word}</strong><br>
                           Peak year: ~${Math.round(d.weightedYear)}<br>
                           Appears in: ${d.numPeriods} periods<br>
                           Total frequency: ${d.totalFreq}<br>
                           <br><small>${periods}</small>`);
            })
            .on("mousemove", function(event) {
                tooltip
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 28) + "px");
            })
            .on("mouseout", function() {
                tooltip.style("opacity", 0);
            });
            
            simulation.on("tick", () => {
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function resetZoom() {
            svg.transition()
                .duration(750)
                .call(zoom.transform, d3.zoomIdentity);
        }

        function restartSimulation() {
            if (simulation) simulation.stop();
            initSimulation();
        }

        function updateForceStrength(value) {
            document.getElementById('forceValue').textContent = value;
            if (simulation) {
                simulation.force("x").strength(parseFloat(value));
                simulation.force("y").strength(parseFloat(value));
                simulation.alpha(1).restart();
            }
        }

        async function loadAndVisualize() {
            try {

                const data = await d3.json('word_cloud_data_temporal.json');

                // Extract all unique time points
                const allYears = new Set();
                data.forEach(word => {
                    Object.keys(word.periods).forEach(year => allYears.add(parseInt(year)));
                });
                timePoints = Array.from(allYears).sort((a, b) => a - b);
                
                // Prepare nodes
                nodes = data.map(d => {
                    const totalFreq = Object.values(d.periods).reduce((a, b) => a + b, 0);
                    const target = calculateTemporalTarget(d.periods, false);
                    
                    return {
                        word: d.word,
                        periods: d.periods,
                        totalFreq: totalFreq,
                        specificity: target.specificity,
                        weightedYear: target.weightedYear,
                        numPeriods: target.numPeriods,
                        // Will be set properly when scales are created
                        x: 0,
                        y: 0,
                        target: { x: 0, y: 0 },
                        color: getTemporalColor(target.specificity),
                        radius: Math.sqrt(totalFreq) * 2.5
                    };
                });
                
                initSimulation();
                
                document.getElementById('restartBtn').disabled = false;
                document.getElementById('resetZoomBtn').disabled = false;
                document.getElementById('forceStrength').disabled = false;
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Initialize
        loadAndVisualize();

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (nodes.length > 0) {
                    restartSimulation();
                }
            }, 250);
        });
    </script>
</body>
</html>
