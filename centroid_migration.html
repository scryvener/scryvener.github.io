<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centroid Migration Explorer</title>
  <!-- D3 v7 -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <style>
    :root {
      --bg: #0b1020;
      --panel: #121a33;
      --ink: #e9eefc;
      --muted: #93a0c8;
      --accent: #6fa8ff;
      --dim: 0.15;
    }
    body {
      margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg); color: var(--ink);
    }
    .app {
      display: grid; grid-template-columns: 320px 1fr; gap: 12px; height: 100vh; padding: 12px;
    }
    .panel {
      background: var(--panel); border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .controls { display: grid; gap: 12px; }
    .control label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    select, input[type="range"], input[type="text"] {
      width: 100%; background: #0d1530; color: var(--ink); border: 1px solid #223064; border-radius: 10px; padding: 8px 10px;
    }
    .legend {
      border: 1px solid #223064; border-radius: 12px; height: 50vh; overflow: auto; padding: 8px; background: #0d1530;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
    .legend-item:hover { background: rgba(255,255,255,.04); }
    .swatch { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 14px; }
    .legend-title { font-size: 12px; color: var(--muted); margin: 8px 8px 6px; text-transform: uppercase; letter-spacing: .08em; }

    .chart-wrap { position: relative; }
    .hud { position: absolute; top: 10px; left: 10px; background: rgba(10, 14, 32, .6); padding: 8px 10px; border-radius: 10px; font-size: 12px; backdrop-filter: blur(6px); }
    .tooltip { position: absolute; pointer-events: none; background: #111a36; border: 1px solid #345; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .15s ease; }
    .footer { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .btn { background: #1a2454; border: 1px solid #2c3f88; padding: 6px 10px; border-radius: 10px; color: var(--ink); cursor: pointer; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .focus-note { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="controls">
        <div>
          <label for="granularity">Granularity</label>
          <select id="granularity">
            <option value="Topic" selected>Topic (default)</option>
            <option value="BroadTopic">BroadTopic</option>
            <option value="SubTopic">SubTopic</option>
          </select>
        </div>
        <div>
          <label for="yearRange">Year: <span id="yearLabel">—</span></label>
          <input id="yearRange" type="range" min="0" max="100" step="1" value="0" />
          <div style="display:flex; gap:8px; margin-top:6px;">
            <button class="btn" id="playBtn">▶ Play</button>
            <button class="btn" id="resetBtn">Reset View</button>
          </div>
        </div>
        <div>
          <label for="searchFilter">Focus a topic (type to filter):</label>
          <input id="searchFilter" type="text" placeholder="e.g., Climate Change" />
          <div class="focus-note">Click a legend item or a point to focus. Click again to clear.</div>
        </div>
        <div>
          <div class="legend-title">Legend</div>
          <div id="legend" class="legend" aria-label="Scrollable legend"></div>
        </div>
        <div class="footer">Tip: Drag to pan. Use trackpad/pinch or mousewheel to zoom. Double‑click the canvas to clear focus.</div>
      </div>
    </aside>

    <main class="panel chart-wrap">
      <div class="hud">Granularity: <strong id="hudGran">Topic</strong> · Year: <strong id="hudYear">—</strong> · Focus: <strong id="hudFocus">All</strong></div>
      <svg id="chart" width="100%" height="100%" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tooltip" class="tooltip"></div>
    </main>
  </div>

  <script>
    // ===================== CONFIG =====================
    // 1) Set your CSV path here (same-origin or permitted by CORS)
    const CSV_PATH = "date_centroid.csv"; // <-- update to your file path

    // 2) Visual config
    const MARGINS = { top: 40, right: 30, bottom: 50, left: 60 };
    const WIDTH = 1200, HEIGHT = 800;

    // Color palettes per granularity (distinct look for each)
    const palettes = {
      BroadTopic: d3.schemeTableau10,
      Topic: d3.schemeSet3,
      SubTopic: d3.schemePaired
    };

    // Helper to map names -> colors with graceful wrap
    function colorLookup(names, paletteName) {
      const pal = palettes[paletteName] || d3.schemeTableau10;
      const map = new Map();
      names.forEach((n, i) => map.set(n, pal[i % pal.length]));
      return (name) => map.get(name) || pal[0];
    }

    // ===================== STATE =====================
    let raw = [];
    let years = [];
    let currentYearIndex = 0;
    let currentGranularity = 'Topic';
    let focusKey = null; // the string value for the selected granularity (e.g., a Topic name)

    // ===================== SCAFFOLD SVG =====================
    const svg = d3.select('#chart');
    const gRoot = svg.append('g').attr('class', 'root');

    // Arrowhead marker for trajectories
    svg.append('defs').append('marker')
      .attr('id', 'arrow')
      .attr('viewBox', '0 0 10 10')
      .attr('refX', 8).attr('refY', 5)
      .attr('markerWidth', 6).attr('markerHeight', 6)
      .attr('orient', 'auto-start-reverse')
      .append('path')
      .attr('d', 'M 0 0 L 10 5 L 0 10 z')
      .attr('fill', '#9fb7ff');

    const plotW = WIDTH - MARGINS.left - MARGINS.right;
    const plotH = HEIGHT - MARGINS.top - MARGINS.bottom;

    const gChart = gRoot.append('g').attr('transform', `translate(${MARGINS.left},${MARGINS.top})`);
    const gGrid = gChart.append('g').attr('class', 'grid');
    const gTraj = gChart.append('g').attr('class', 'trajectories');
    const gPoints = gChart.append('g').attr('class', 'points');
    const gAxes = gChart.append('g').attr('class', 'axes');

    const xScale = d3.scaleLinear().range([0, plotW]);
    const yScale = d3.scaleLinear().range([plotH, 0]);

    const xAxisG = gAxes.append('g').attr('transform', `translate(0,${plotH})`);
    const yAxisG = gAxes.append('g');

    // Zoom & pan (domain stays constant globally; zoom transforms the rendered space)
    const zoom = d3.zoom()
      .scaleExtent([0.5, 20])
      .on('zoom', (e) => {
        const t = e.transform;
        gGrid.attr('transform', t);
        gTraj.attr('transform', t);
        gPoints.attr('transform', t);
        // Axes reflect zoom for better readability
        const zx = t.rescaleX(xScale);
        const zy = t.rescaleY(yScale);
        xAxisG.call(d3.axisBottom(zx).ticks(10));
        yAxisG.call(d3.axisLeft(zy).ticks(10));
      });

    svg.call(zoom);

    // Reset view
    document.getElementById('resetBtn').addEventListener('click', () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });

    // ===================== LOAD DATA =====================
    d3.csv(CSV_PATH, d3.autoType).then(setup);

    function detectGranularity(row) {
      // Infer granularity from which fields have values
      if (row.SubTopic && String(row.SubTopic).trim() !== '') return 'SubTopic';
      if (row.Topic && String(row.Topic).trim() !== '') return 'Topic';
      return 'BroadTopic';
    }

    function setup(data) {
      // Enrich rows
      raw = data.map(d => ({
        ...d,
        year: +d.Date,
        x: +d.x,
        y: +d.y,
        granularity: detectGranularity(d)
      }));

      // Build global domains for constant axis scaling
      const xExtent = d3.extent(raw, d => d.x);
      const yExtent = d3.extent(raw, d => d.y);
      const pad = 0.05; // 5% padding
      const xPad = (xExtent[1] - xExtent[0]) * pad;
      const yPad = (yExtent[1] - yExtent[0]) * pad;
      xScale.domain([xExtent[0] - xPad, xExtent[1] + xPad]);
      yScale.domain([yExtent[0] - yPad, yExtent[1] + yPad]);

      // Draw static grid
      gGrid.selectAll('.xgrid').data(d3.range(10)).join('line')
        .attr('class', 'xgrid')
        .attr('x1', d => (plotW/10)*d)
        .attr('x2', d => (plotW/10)*d)
        .attr('y1', 0)
        .attr('y2', plotH)
        .attr('stroke', '#1b2b61')
        .attr('opacity', 0.3);
      gGrid.selectAll('.ygrid').data(d3.range(10)).join('line')
        .attr('class', 'ygrid')
        .attr('y1', d => (plotH/10)*d)
        .attr('y2', d => (plotH/10)*d)
        .attr('x1', 0)
        .attr('x2', plotW)
        .attr('stroke', '#1b2b61')
        .attr('opacity', 0.3);

      xAxisG.call(d3.axisBottom(xScale));
      yAxisG.call(d3.axisLeft(yScale));

      // Years and slider
      years = Array.from(new Set(raw.map(d => d.year))).sort((a,b)=>a-b);
      const slider = document.getElementById('yearRange');
      slider.min = 0;
      slider.max = years.length - 1;
      slider.value = 0;
      currentYearIndex = 0;
      updateHUD();

      // Initial render
      buildLegend();
      render();

      // Event bindings
      document.getElementById('granularity').addEventListener('change', (e) => {
        currentGranularity = e.target.value;
        focusKey = null; // clear focus on mode change
        buildLegend();
        render(true);
      });

      slider.addEventListener('input', () => {
        currentYearIndex = +slider.value;
        updateHUD();
        render();
      });

      document.getElementById('playBtn').addEventListener('click', handlePlay);
      document.getElementById('searchFilter').addEventListener('input', filterLegend);

      svg.on('dblclick', () => { focusKey = null; updateHUD(); render(); });
    }

    function updateHUD() {
      document.getElementById('hudGran').textContent = currentGranularity;
      document.getElementById('hudYear').textContent = years[currentYearIndex] ?? '—';
      document.getElementById('hudFocus').textContent = focusKey || 'All';
      document.getElementById('yearLabel').textContent = years[currentYearIndex] ?? '—';
    }

    // ===================== LEGEND =====================
    function uniqueKeys(granularity) {
      const keySet = new Set(
        raw.filter(d => d.granularity === granularity).map(d => d[granularity])
      );
      return Array.from(keySet).sort((a,b) => d3.ascending(String(a), String(b)));
    }

    function buildLegend() {
      const legend = d3.select('#legend');
      legend.selectAll('*').remove();

      const keys = uniqueKeys(currentGranularity);
      const color = colorLookup(keys, currentGranularity);

      // Build items
      const items = legend.selectAll('.legend-item')
        .data(keys, d => d)
        .join(enter => {
          const row = enter.append('div')
            .attr('class', 'legend-item')
            .on('click', (_, key) => {
              focusKey = (focusKey === key) ? null : key; // toggle focus
              updateHUD();
              render();
            });
          row.append('div').attr('class', 'swatch').style('background', d => color(d));
          row.append('div').text(d => d);
          return row;
        });

      // Keep a reference to colors for render
      buildLegend.color = color;
      filterLegend();
    }

    function filterLegend() {
      const q = (document.getElementById('searchFilter').value || '').toLowerCase();
      const sel = d3.select('#legend').selectAll('.legend-item');
      sel.style('display', function(_, i, nodes) {
        const text = d3.select(this).text().toLowerCase();
        return text.includes(q) ? 'flex' : 'none';
      });
    }

    // ===================== RENDER =====================
    function keyedNowData() {
      const year = years[currentYearIndex];
      // rows for the current granularity and year
      const subset = raw.filter(d => d.granularity === currentGranularity && d.year === year);
      // color lookup for this mode
      const keys = uniqueKeys(currentGranularity);
      const color = buildLegend.color || colorLookup(keys, currentGranularity);
      return { subset, color };
    }

    function allSeriesByCategory() {
      // Group by category_id for the current granularity
      const rows = raw.filter(d => d.granularity === currentGranularity);
      return d3.group(rows, d => d.category_id);
    }

    function render(skipAnimate = false) {
      updateHUD();
      const { subset, color } = keyedNowData();
      const series = allSeriesByCategory();
      const t = d3.transition().duration(skipAnimate ? 0 : 650).ease(d3.easeCubicInOut);

      // ----- Trajectories up to current year -----
      const cutoffYear = years[currentYearIndex];
      const line = d3.line()
        .x(d => xScale(d.x))
        .y(d => yScale(d.y));

      const trajData = Array.from(series, ([cid, arr]) => {
        const sorted = arr.filter(d => d.year <= cutoffYear).sort((a,b)=>a.year-b.year);
        return { cid, granKey: sorted[0]?.[currentGranularity], points: sorted };
      }).filter(d => d.points.length > 1);

      const paths = gTraj.selectAll('path.traj')
        .data(trajData, d => d.cid);

      paths.join(
        enter => enter.append('path')
          .attr('class', 'traj')
          .attr('fill', 'none')
          .attr('stroke-width', 1.5)
          .attr('stroke', d => color(d.granKey))
          .attr('marker-end', 'url(#arrow)')
          .attr('opacity', d => focusKey && d.granKey !== focusKey ? 0.12 : 0.65)
          .attr('d', d => line(d.points))
          .append('title').text(d => d.granKey),
        update => update
          .call(u => u.transition(t)
            .attr('stroke', d => color(d.granKey))
            .attr('opacity', d => focusKey && d.granKey !== focusKey ? 0.12 : 0.65)
            .attr('d', d => line(d.points))
          ),
        exit => exit.remove()
      );

      // ----- Points for current year -----
      const points = gPoints.selectAll('circle.point')
        .data(subset, d => d.category_id);

      points.join(
        enter => enter.append('circle')
          .attr('class', 'point')
          .attr('r', 4)
          .attr('cx', d => xScale(d.x))
          .attr('cy', d => yScale(d.y))
          .attr('fill', d => color(d[currentGranularity]))
          .attr('opacity', d => focusKey && d[currentGranularity] !== focusKey ? 0.2 : 1)
          .on('pointerenter', handlePointerEnter)
          .on('pointerleave', handlePointerLeave)
          .on('click', (_, d) => {
            const key = d[currentGranularity];
            focusKey = (focusKey === key) ? null : key;
            updateHUD();
            render();
          })
          .append('title').text(d => `${d[currentGranularity]} — ${d.year}`),
        update => update
          .call(u => u.transition(t)
            .attr('cx', d => xScale(d.x))
            .attr('cy', d => yScale(d.y))
            .attr('fill', d => color(d[currentGranularity]))
            .attr('opacity', d => focusKey && d[currentGranularity] !== focusKey ? 0.2 : 1)
          ),
        exit => exit.remove()
      );
    }

    // ===================== PLAY/ANIMATE =====================
    let playing = false; let playTimer = null;
    function handlePlay() {
      const btn = document.getElementById('playBtn');
      if (!playing) {
        playing = true; btn.textContent = '⏸ Pause';
        step();
      } else {
        playing = false; btn.textContent = '▶ Play';
        clearTimeout(playTimer);
      }
      function step() {
        if (!playing) return;
        currentYearIndex = (currentYearIndex + 1) % years.length;
        document.getElementById('yearRange').value = currentYearIndex;
        updateHUD();
        render();
        playTimer = setTimeout(step, 1100);
      }
    }

    // ===================== TOOLTIP =====================
    const tooltip = d3.select('#tooltip');
    function handlePointerEnter(e, d) {
      const name = d[currentGranularity];
      tooltip.style('opacity', 1)
        .html(`<strong>${name}</strong><br/>(${d.x.toFixed(2)}, ${d.y.toFixed(2)}) · ${d.year}`);
      positionTooltip(e);
      d3.select(window).on('pointermove.tooltip', (ev) => positionTooltip(ev));
    }
    function handlePointerLeave() {
      tooltip.style('opacity', 0);
      d3.select(window).on('pointermove.tooltip', null);
    }
    function positionTooltip(e) {
      const pad = 12;
      tooltip.style('left', (e.clientX + pad) + 'px')
        .style('top', (e.clientY + pad) + 'px');
    }

  </script>
</body>
</html>
