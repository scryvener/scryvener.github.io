<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic Centroid Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        #container {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        #main-content {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        #controls label {
            font-weight: 600;
            margin-right: 8px;
        }
        
        #controls select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        
        #slider-container {
            flex: 1;
            min-width: 300px;
        }
        
        #date-slider {
            width: 100%;
            margin-top: 5px;
        }
        
        #date-display {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-left: 10px;
        }
        
        #chart {
            position: relative;
        }
        
        .centroid {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .centroid.dimmed {
            opacity: 0.15;
        }
        
        .centroid.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .trajectory {
            fill: none;
            stroke-width: 2;
            opacity: 0.6;
            pointer-events: none;
        }
        
        .trajectory-arrow {
            fill: none;
            opacity: 0.6;
            pointer-events: none;
        }
        
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
            z-index: 100;
            max-width: 250px;
        }
        
        #sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            display: none;
        }
        
        #sidebar.visible {
            display: block;
        }
        
        #sidebar h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        #sidebar .close-btn {
            float: right;
            cursor: pointer;
            font-size: 24px;
            color: #999;
            line-height: 1;
            margin-top: -5px;
        }
        
        #sidebar .close-btn:hover {
            color: #333;
        }
        
        #sidebar .info-section {
            margin-bottom: 15px;
        }
        
        #sidebar .info-label {
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
        }
        
        #sidebar .info-content {
            color: #333;
            line-height: 1.5;
        }
        
        .legend {
            font-size: 12px;
        }
        
        .legend-item {
            cursor: pointer;
        }
        
        .legend-item.inactive {
            opacity: 0.3;
        }
        
        .legend-item rect {
            stroke: #333;
            stroke-width: 1;
        }
        
        #trajectory-note {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-top: 10px;
            display: none;
        }
        
        #trajectory-note.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="main-content">
            <div id="controls">
                <div>
                    <label for="granularity-select">Granularity:</label>
                    <select id="granularity-select">
                        <option value="BroadTopic">BroadTopic</option>
                        <option value="Topic" selected>Topic</option>
                        <option value="SubTopic">SubTopic</option>
                    </select>
                </div>
                <div id="slider-container">
                    <label for="date-slider">Time Period:</label>
                    <input type="range" id="date-slider" min="0" max="0" value="0" step="1">
                    <span id="date-display">Loading...</span>
                </div>
            </div>
            <div id="trajectory-note">Trajectories show the full historical path of focused topics</div>
            <div id="chart"></div>
        </div>
        <div id="sidebar">
            <span class="close-btn">&times;</span>
            <h3 id="sidebar-title"></h3>
            <div class="info-section">
                <div class="info-label">Count:</div>
                <div class="info-content" id="sidebar-count"></div>
            </div>
            <div class="info-section">
                <div class="info-label">Key Terms:</div>
                <div class="info-content" id="sidebar-representation"></div>
            </div>
            <div class="info-section">
                <div class="info-label">Representative Documents:</div>
                <div class="info-content" id="sidebar-docs"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const margin = {top: 20, right: 120, bottom: 50, left: 60};
        const width = 900 - margin.left - margin.right;
        const height = 600 - margin.top - margin.bottom;
        
        // Color schemes for each granularity level
        const colorSchemes = {
            BroadTopic: d3.schemeSet2,
            Topic: d3.schemeTableau10,
            SubTopic: d3.schemePaired
        };
        
        // State
        let csvData = [];
        let jsonData = [];
        let currentGranularity = 'Topic';
        let currentDateIndex = 0;
        let availableDates = [];
        let focusedTopic = null;
        let selectedTopics = new Set();
        let xScale, yScale;
        let svg, chartGroup, tooltip;
        
        // Load data
        Promise.all([
            d3.csv('date_centroid_viz.csv'),
            d3.text('centroid_info.json')
        ]).then(([csv, jsonText]) => {
            csvData = csv;
            
            // Parse NDJSON
            jsonData = jsonText.trim().split('\n').map(line => JSON.parse(line));
            
            // Create lookup for JSON data
            const jsonLookup = {};
            jsonData.forEach(item => {
                jsonLookup[item.category_id] = item;
            });
            
            // Merge data
            csvData.forEach(d => {
                d.x = +d.x;
                d.y = +d.y;
                const info = jsonLookup[d.category_id];
                if (info) {
                    d.Name = info.Name;
                    d.Count = info.Count;
                    d.Representation = info.Representation;
                    d.Representative_Docs = info.Representative_Docs;
                }
            });
            
            // Get unique dates sorted
            availableDates = [...new Set(csvData.map(d => d.Date))].sort();
            
            // Initialize visualization
            initVisualization();
            updateVisualization();
        });
        
        function initVisualization() {
            // Setup scales with fixed ranges
            const allX = csvData.map(d => d.x);
            const allY = csvData.map(d => d.y);
            
            xScale = d3.scaleLinear()
                .domain([d3.min(allX), d3.max(allX)])
                .range([0, width])
                .nice();
            
            yScale = d3.scaleLinear()
                .domain([d3.min(allY), d3.max(allY)])
                .range([height, 0])
                .nice();
            
            // Create SVG
            svg = d3.select('#chart')
                .append('svg')
                .attr('width', width + margin.left + margin.right)
                .attr('height', height + margin.top + margin.bottom);
            
            chartGroup = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.5, 5])
                .on('zoom', (event) => {
                    chartGroup.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            // Add axes
            chartGroup.append('g')
                .attr('class', 'x-axis')
                .attr('transform', `translate(0,${height})`)
                .call(d3.axisBottom(xScale));
            
            chartGroup.append('g')
                .attr('class', 'y-axis')
                .call(d3.axisLeft(yScale));
            
            // Add axis labels
            svg.append('text')
                .attr('text-anchor', 'middle')
                .attr('x', width / 2 + margin.left)
                .attr('y', height + margin.top + margin.bottom - 10)
                .text('X Coordinate');
            
            svg.append('text')
                .attr('text-anchor', 'middle')
                .attr('transform', `translate(15,${height / 2 + margin.top})rotate(-90)`)
                .text('Y Coordinate');
            
            // Create tooltip
            tooltip = d3.select('body')
                .append('div')
                .attr('class', 'tooltip')
                .style('opacity', 0);
            
            // Setup date slider
            d3.select('#date-slider')
                .attr('max', availableDates.length - 1)
                .on('input', function() {
                    currentDateIndex = +this.value;
                    updateVisualization();
                });
            
            // Setup granularity selector
            d3.select('#granularity-select')
                .on('change', function() {
                    currentGranularity = this.value;
                    selectedTopics.clear();
                    focusedTopic = null;
                    closeSidebar();
                    updateVisualization();
                });
            
            // Setup sidebar close
            d3.select('.close-btn').on('click', closeSidebar);
            d3.select('body').on('click', function(event) {
                if (!event.target.closest('#sidebar') && 
                    !event.target.closest('.centroid')) {
                    closeSidebar();
                }
            });
            
            // Update date display
            d3.select('#date-display').text(availableDates[currentDateIndex]);
        }
        
        function updateVisualization() {
            const currentDate = availableDates[currentDateIndex];
            d3.select('#date-display').text(currentDate);
            
            // Filter data for current date and granularity
            const currentData = csvData.filter(d => 
                d.Date === currentDate && d[currentGranularity]
            );
            
            // Get unique topics and create color scale
            const uniqueTopics = [...new Set(currentData.map(d => d[currentGranularity]))];
            const colorScale = d3.scaleOrdinal()
                .domain(uniqueTopics)
                .range(colorSchemes[currentGranularity]);
            
            // Update or create trajectories
            updateTrajectories(colorScale);
            
            // Bind data to centroids
            const centroids = chartGroup.selectAll('.centroid')
                .data(currentData, d => d.category_id);
            
            // Enter
            const centroidsEnter = centroids.enter()
                .append('circle')
                .attr('class', 'centroid')
                .attr('r', 6)
                .attr('cx', d => xScale(d.x))
                .attr('cy', d => yScale(d.y))
                .attr('fill', d => colorScale(d[currentGranularity]))
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip)
                .on('click', clickCentroid);
            
            // Update
            centroids.merge(centroidsEnter)
                .transition()
                .duration(500)
                .attr('cx', d => xScale(d.x))
                .attr('cy', d => yScale(d.y))
                .attr('fill', d => colorScale(d[currentGranularity]))
                .attr('class', d => {
                    let className = 'centroid';
                    if (focusedTopic && d.category_id !== focusedTopic) {
                        className += ' dimmed';
                    }
                    if (selectedTopics.size > 0 && !selectedTopics.has(d[currentGranularity])) {
                        className += ' hidden';
                    }
                    return className;
                });
            
            // Exit
            centroids.exit().remove();
            
            // Update legend
            updateLegend(uniqueTopics, colorScale);
        }
        
        function updateTrajectories(colorScale) {
            // Clear existing trajectories
            chartGroup.selectAll('.trajectory').remove();
            chartGroup.selectAll('.trajectory-arrow').remove();
            
            if (!focusedTopic) {
                d3.select('#trajectory-note').classed('visible', false);
                return;
            }
            
            d3.select('#trajectory-note').classed('visible', true);
            
            // Get trajectory data for focused topic
            const trajectoryData = csvData
                .filter(d => d.category_id === focusedTopic)
                .sort((a, b) => availableDates.indexOf(a.Date) - availableDates.indexOf(b.Date));
            
            if (trajectoryData.length < 2) return;
            
            const line = d3.line()
                .x(d => xScale(d.x))
                .y(d => yScale(d.y))
                .curve(d3.curveMonotoneX);
            
            // Draw trajectory line
            chartGroup.append('path')
                .datum(trajectoryData)
                .attr('class', 'trajectory')
                .attr('d', line)
                .attr('stroke', colorScale(trajectoryData[0][currentGranularity]))
                .lower();
            
            // Add arrows along the path
            for (let i = 0; i < trajectoryData.length - 1; i++) {
                const start = trajectoryData[i];
                const end = trajectoryData[i + 1];
                
                const x1 = xScale(start.x);
                const y1 = yScale(start.y);
                const x2 = xScale(end.x);
                const y2 = yScale(end.y);
                
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                
                chartGroup.append('path')
                    .attr('class', 'trajectory-arrow')
                    .attr('d', `M${midX},${midY} L${midX - 8 * Math.cos(angle - Math.PI / 6)},${midY - 8 * Math.sin(angle - Math.PI / 6)} M${midX},${midY} L${midX - 8 * Math.cos(angle + Math.PI / 6)},${midY - 8 * Math.sin(angle + Math.PI / 6)}`)
                    .attr('stroke', colorScale(trajectoryData[0][currentGranularity]))
                    .attr('stroke-width', 2)
                    .lower();
            }
        }
        
        function updateLegend(topics, colorScale) {
            const legendGroup = svg.selectAll('.legend').data([null]);
            const legendEnter = legendGroup.enter()
                .append('g')
                .attr('class', 'legend')
                .attr('transform', `translate(${width + margin.left + 10},${margin.top})`);
            
            const legend = legendGroup.merge(legendEnter);
            
            const items = legend.selectAll('.legend-item')
                .data(topics);
            
            const itemsEnter = items.enter()
                .append('g')
                .attr('class', 'legend-item')
                .attr('transform', (d, i) => `translate(0,${i * 25})`)
                .on('click', clickLegend);
            
            itemsEnter.append('rect')
                .attr('width', 18)
                .attr('height', 18)
                .attr('fill', d => colorScale(d));
            
            itemsEnter.append('text')
                .attr('x', 24)
                .attr('y', 9)
                .attr('dy', '0.35em')
                .text(d => d.length > 15 ? d.substring(0, 15) + '...' : d)
                .style('font-size', '11px');
            
            items.merge(itemsEnter)
                .classed('inactive', d => selectedTopics.size > 0 && !selectedTopics.has(d))
                .select('rect')
                .attr('fill', d => colorScale(d));
            
            items.merge(itemsEnter)
                .select('text')
                .text(d => d.length > 15 ? d.substring(0, 15) + '...' : d);
            
            items.exit().remove();
        }
        
        function showTooltip(event, d) {
            tooltip.transition()
                .duration(200)
                .style('opacity', 0.9);
            tooltip.html(`<strong>${d.Name || d[currentGranularity]}</strong><br/>Count: ${d.Count || 'N/A'}`)
                .style('left', (event.pageX + 10) + 'px')
                .style('top', (event.pageY - 28) + 'px');
        }
        
        function hideTooltip() {
            tooltip.transition()
                .duration(200)
                .style('opacity', 0);
        }
        
        function clickCentroid(event, d) {
            event.stopPropagation();
            
            // If clicking the same centroid, unfocus
            if (focusedTopic === d.category_id) {
                focusedTopic = null;
                closeSidebar();
            } else {
                focusedTopic = d.category_id;
                selectedTopics.clear();
                showSidebar(d);
            }
            
            updateVisualization();
        }
        
        function clickLegend(event, topicName) {
            event.stopPropagation();
            
            // Close sidebar if it's not for this topic
            const sidebarTitle = d3.select('#sidebar-title').text();
            if (sidebarTitle && sidebarTitle !== topicName) {
                closeSidebar();
            }
            
            // Toggle topic selection
            if (selectedTopics.has(topicName)) {
                selectedTopics.delete(topicName);
            } else {
                selectedTopics.add(topicName);
            }
            
            // Clear focused topic when using legend
            focusedTopic = null;
            
            updateVisualization();
        }
        
        function showSidebar(d) {
            d3.select('#sidebar').classed('visible', true);
            d3.select('#sidebar-title').text(d.Name || d[currentGranularity]);
            d3.select('#sidebar-count').text(d.Count || 'N/A');
            
            if (d.Representation) {
                const repr = Array.isArray(d.Representation) ? d.Representation.join(', ') : d.Representation;
                d3.select('#sidebar-representation').text(repr);
            }
            
            if (d.Representative_Docs) {
                const docs = Array.isArray(d.Representative_Docs) ? 
                    d.Representative_Docs.map((doc, i) => `${i + 1}. ${doc}`).join('<br/><br/>') : 
                    d.Representative_Docs;
                d3.select('#sidebar-docs').html(docs);
            }
        }
        
        function closeSidebar() {
            d3.select('#sidebar').classed('visible', false);
            if (focusedTopic) {
                focusedTopic = null;
                updateVisualization();
            }
        }
    </script>
</body>
</html>
